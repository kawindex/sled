name: Python build and publish

on: workflow_dispatch

env:
  UV_MANAGED_PYTHON: true
  USE_UV_VERSION: '0.10.12'

jobs:
  invoke-python-test:
    name: Invoke Python test
    uses: ./.github/workflows/python-test.yml

  python-build:
    name: Python build
    needs: invoke-python-test
    runs-on: ubuntu-latest
    outputs:
      parsled_version: ${{ steps.get_parsled_version.outputs.parsled_version }}

    steps:
      - name: Checkout python directory
        uses: actions/checkout@v6
        with:
          sparse-checkout: python/

      - name: Log commit SHA
        run: 'echo "commit SHA: ${GITHUB_SHA}"'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.USE_UV_VERSION }}

      - name: Get parsled version
        id: get_parsled_version
        working-directory: ${{ github.workspace }}/python
        run: 'echo "parsled_version=$(uv version --short)" >> "${GITHUB_OUTPUT}"'

      # - name: Stop if tag fails to match version
      #   if: '${{ ! endsWith( github.ref_name, steps.get_parsled_version.outputs.parsled_version ) }}'
      #   run: 'false'

      - name: Build distributions using uv
        working-directory: ${{ github.workspace }}/python
        run: uv build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: parsled-dist
          path: ${{ github.workspace }}/python/dist

  python-test-distribution:
    name: Python ${{ matrix.python-version }} test ${{ matrix.distribution-suffix }} distribution
    needs: python-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.8'
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
        distribution-suffix:
          - '-py3-none-any.whl'
          - '.tar.gz'
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      PARSLED_DIST_PATH: ${{ github.workspace }}/python/dist/parsled-${{ needs.python-build.outputs.parsled_version }}${{ matrix.distribution-suffix }}

    steps:
      - name: Checkout python/scripts and testdata directories
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            python/scripts/
            python/tests/
            testdata/

      - name: Log commit SHA
        run: 'echo "commit SHA: ${GITHUB_SHA}"'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.USE_UV_VERSION }}
          python-version: ${{ matrix.python-version }}

      - name: Install Python
        working-directory: ${{ github.workspace }}/python
        run: uv python install ${{ matrix.python-version }}

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: parsled-dist
          path: ${{ github.workspace }}/python/dist

      - name: Run pytest on built distribution
        run: 'bash "${GITHUB_WORKSPACE}/python/scripts/pytest_built_dist.sh"'

      - name: Smoke test built distribution without pytest
        working-directory: ${{ github.workspace }}/python
        run: >
          uv run
          --isolated
          --no-project
          --no-cache
          --with "${PARSLED_DIST_PATH}"
          "${GITHUB_WORKSPACE}/python/scripts/smoke_test.py"

  python-publish:
    name: Python publish to PyPI test
    needs: python-test-distribution
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/parsled
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.USE_UV_VERSION }}

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: parsled-dist
          path: ${{ github.workspace }}/python/dist

      - name: Publish to PyPI
        run: uv publish

  python-test-pypi:
    name: Python ${{ matrix.python-version }} test distribution from PyPI
    needs: python-publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.8'
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Checkout python/scripts and testdata directories
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            python/scripts/
            python/tests/
            testdata/

      - name: Log commit SHA
        run: 'echo "commit SHA: ${GITHUB_SHA}"'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.USE_UV_VERSION }}
          python-version: ${{ matrix.python-version }}

      - name: Install Python
        working-directory: ${{ github.workspace }}/python
        run: uv python install ${{ matrix.python-version }}

      - name: Run pytest on distribution installed from PyPI
        run: 'bash "${GITHUB_WORKSPACE}/python/scripts/pytest_pypi.sh"'

      - name: Smoke test distribution installed from PyPI without pytest
        run: >
          uv run
          --isolated
          --no-project
          --no-cache
          --with parsled
          "${GITHUB_WORKSPACE}/python/scripts/smoke_test.py"
