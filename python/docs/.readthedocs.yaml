version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    install:
      - pip install -r python/docs/requirements.txt
      - pip install -e python/
    build:
      html:
      - zensical build --clean --strict --config-file=python/docs/zensical.toml
    post_build:
      - bash python/docs/scripts/rtd-post-build.sh
