[project]
site_name = "Parsled"
site_description = "Python package for parsing Sled and serializing Python objects as Sled."
site_author = "Kawin"
copyright = "&copy; 2026 Kawin"
repo_url = "https://github.com/kawindex/sled/tree/main/python"
repo_name = "Parsled on GitHub"

docs_dir = "md"    # Markdown source
site_dir = "html"  # HTML build output for static site

nav = [
  {"Parsled" = "index.md"},
  {"What is Sled?" = "sled.md"},
  {"API reference" = "api.md"},
  {"Serialization guide" = "serialization.md"},
  {"More about Sled" = [
     {"Grammar" = "sled/grammar.md"},
     {"Spec" = "sled/spec.md"},
  ]}
]


# Theme

[project.theme]
# favicon = "images/favicon.png"
features = [
  "content.code.copy",
  "content.code.select",
]

[project.theme.icon]
repo = "fontawesome/brands/git-alt"

# Palette toggle for automatic mode
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Toggle between light mode, dark mode and auto (system preference)"

# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Toggle between light mode, dark mode and auto (system preference)"

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Toggle between light mode, dark mode and auto (system preference)"


# Markdown extensions

[project.markdown_extensions.pymdownx.emoji]

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.highlight]
pygments_lang_class = true
auto_title = true
linenums_style = "pymdownx-inline"
anchor_linenums = true
line_spans = "__span"

[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = "#"
toc_depth = 4

[project.markdown_extensions.zensical.extensions.macros]
module_name = "macros"
render_by_default = true
on_error_fail = true
on_undefined = "strict"


# mkdocstrings

[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
inventories = [
  "https://docs.python.org/3/objects.inv"
]
paths = ["../src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
docstring_section_style = "spacy"
show_docstring_description = true
show_docstring_examples = true
show_docstring_parameters = true
scoped_crossrefs = true
show_source = false
show_bases = false
show_inheritance_diagram = false

# Signatures
show_signature = true
line_length = 60
show_signature_annotations = true
show_signature_type_parameters = true
signature_crossrefs = true
modernize_annotations = true
merge_init_into_class = false

# Members
inherited_members = true
members_order = "source"

# Headings
heading_level = 3
show_root_heading = true
show_root_full_path = false
separate_signature = true
parameter_headings = true
type_parameter_headings = true
show_symbol_type_heading = true
show_symbol_type_toc = true

[project.plugins.mkdocstrings.handlers.python.options.docstring_options]
ignore_init_summary = false
trim_doctest_flags = true
returns_multiple_items = true
warnings = true
warn_unknown_params = true
warn_missing_types = true
